<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300"><title>Semantic Extraction Pipeline</title><defs><style>text{font-family:Inter,system-ui,-apple-system,sans-serif}</style><filter id="sh" width="124%" height="124%" x="-12%" y="-12%"><feDropShadow dx="0" dy="2" flood-color="#00000012" stdDeviation="5"/></filter><linearGradient id="g-text" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient><linearGradient id="g-ner" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient><linearGradient id="g-rel" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient><linearGradient id="g-coref" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient><linearGradient id="g-trip" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="g-kg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#ea580c"/></linearGradient><clipPath id="ctext"><rect width="240" height="54" x="250" y="20" rx="10"/></clipPath><clipPath id="cner"><rect width="170" height="72" x="40" y="120" rx="10"/></clipPath><clipPath id="crel"><rect width="170" height="72" x="285" y="120" rx="10"/></clipPath><clipPath id="ccoref"><rect width="170" height="72" x="530" y="120" rx="10"/></clipPath><clipPath id="ctrip"><rect width="340" height="52" x="200" y="228" rx="10"/></clipPath><marker id="arr" markerHeight="7" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#94a3b8" points="0 0 9 3.5 0 7"/></marker></defs><rect width="740" height="300" fill="#f1f5f9" rx="16"/><text x="370" y="288" fill="#94a3b8" font-size="10" text-anchor="middle">All extractors support pattern · ml · llm