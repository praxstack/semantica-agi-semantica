ight="28" x="530" y="120" fill="url(#g-coref)" clip-path="url(#ccoref)"/><text x="615" y="136" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">CoreferenceResolver</text><text x="615" y="163" fill="#334155" font-size="10.5" font-weight="600" text-anchor="middle">References</text><text x="615" y="178" fill="#64748b" font-size="9.5" text-anchor="middle">&quot;the company&quot; → Apple Inc.</text><line x1="160" x2="280" y1="192" y2="226" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/><line x1="370" x2="370" y1="192" y2="226" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/><line x1="580" x2="460" y1="192" y2="226" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/><rect width="340" height="52" x="200" y="228" fill="#fff" filter="url(#sh)" rx="10"/><rect width="340" height="24" x="200" y="228" fill="url(#g-trip)" clip-path="url(#ctrip)"/><text x="370" y="243" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">TripletExtractor — (subject, predicate, object)</text><text x="370" y="267" fill="#334155" font-size="10.5" font-weight="600" text-anchor="middle">(Steve Jobs, founded, Apple Inc.) · (Apple Inc., located_in, Cupertino)</text></svg>