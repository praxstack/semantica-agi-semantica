<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280"><title>Reasoning and Inference Chain</title><defs><style>text{font-family:Inter,system-ui,-apple-system,sans-serif}</style><filter id="sh" width="124%" height="130%" x="-12%" y="-12%"><feDropShadow dx="0" dy="2" flood-color="#00000012" stdDeviation="5"/></filter><linearGradient id="g-fact" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient><linearGradient id="g-rule" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient><linearGradient id="g-inf" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="g-exp" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#ea580c"/></linearGradient><clipPath id="cf1"><rect width="176" height="68" x="20" y="60" rx="10"/></clipPath><clipPath id="cf2"><rect width="176" height="68" x="20" y="152" rx="10"/></clipPath><clipPath id="cr"><rect width="176" height="100" x="270" y="90" rx="12"/></clipPath><clipPath id="ci"><rect width="176" height="68" x="516" y="60" rx="10"/></clipPath><clipPath id="ce"><rect width="176" height="68" x="516" y="152" rx="10"/></clipPath><marker id="arr" markerHeight="7" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#94a3b8" points="0 0 9 3.5 0 7"/></marker></defs><rect width="800" height="280" fill="#f1f5f9" rx="16"/><text x="400" y="30" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">Reasoning Engine — Forward Chaining Inference</text><rect width="176" height="68" x="20" y="60" fill="#fff" filter="url(#sh)" rx="10"/><rect width="176" height="26" x="20" y="60" fill="url(#g-fact)" clip-path="url(#cf1)"/><text x="108" y="76" fill="#fff" font-size="9.5" font-weight="700" text-anchor="middle">KNOWN FACT</text><text x="108" y="104" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Steve Jobs</text><text x="108" y="120" fill="#64748b" font-size="10.5" text-anchor="middle">founded Apple Inc.</text><rect width="176" height="68" x="20" y="152" fill="#fff" filter="url(#sh)" rx="10"/><rect width="176" height="26" x="20" y="152" fill="url(#g-fact)" clip-path="url(#cf2)"/><text x="108" y="168" fill="#fff" font-size="9.5" font-weight="700" text-anchor="middle">KNOWN FACT</text><text x="108" y="196" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Apple Inc.</text><text x="108" y="212" fill="#64748b" font-size="10.5" text-anchor="middle">headquartered in Cupertino</text><line x1="196" x2="262" y1="100" y2="128" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/><line x1="196" x2="262" y1="186" y2="158" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/><text x="108" y="50" fill="#0891b2" font-size="10" font-weight="600" text-anchor="middle">Base Facts</text><rect width="176" height="100" x="270" y="90" fill="#fff" filter="url(#sh)" rx="12"/><rect width="176" height="32" x="270" y="90" fill="url(#g-rule)" clip-path="url(#cr)"/><text x="358" y="107" fill="#fff" font-size="9" font-weight="700" letter-spacing="1" opacity=".8" text-anchor="middle">RULE ENGINE</text><text x="358" y="120" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">IF / THEN Rule</text><text x="358" y="148" fill="#334155" font-size="10" text-anchor="middle">IF ?x founded ?y</text><text x="358" y="163" fill="#334155" font-size="10" text-anchor="middle">AND ?y located_in ?z</text><text x="358" y="178" fill="#334155" font-size="10" text-anchor="middle">THEN ?x connected_to ?z</text><line x1="446" x2="508" y1="130" y2="106" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/><line x1="446" x2="508" y1="150" y2="182" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arr)"/><rect width="260" height="68" x="516" y="60" fill="#fff" filter="url(#sh)" rx="10"/><rect width="260" height="26" x="516" y="60" fill="url(#g-inf)" clip-path="url(#ci)"/><text x="646" y="76" fill="#fff" font-size="9.5" font-weight="700" text-anchor="middle">DERIVED FACT</text><text x="646" y="104" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Steve Jobs connected_to Cupertino</text><text x="646" y="120" fill="#059669" font-size="10" text-anchor="middle">confidence: 0.91 · derived via rule #3</text><rect width="260" height="68" x="516" y="152" fill="#fff" filter="url(#sh)" rx="10"/><rect width="260" height="26" x="516" y="152" fill="url(#g-exp)" clip-path="url(#ce)"/><text x="646" y="168" fill="#fff" font-size="9.5" font-weight="700" text-anchor="middle">EXPLANATION PATH</text><text x="646" y="196" fill="#334155" font-size="10.5" text-anchor="middle">Jobs→founded→Apple→located_in→Cupertino</text><text x="646" y="212" fill="#64748b" font-size="10" text-anchor="middle">traceable steps · not a black box</text><text x="646" y="50" fill="#059669" font-size="10" font-weight="600" text-anchor="middle">Derived Knowledge</text><text x="358" y="82" fill="#7c3aed" font-size="10" font-weight="600" text-anchor="middle">Rete · Forward Chain · Datalog</text><text x="400" y="264" fill="#94a3b8" font-size="10" text-anchor="middle">Every derived fact ships with a traceable explanation path — zero black-box conclusions</text></svg>